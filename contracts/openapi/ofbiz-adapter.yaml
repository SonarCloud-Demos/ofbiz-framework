openapi: 3.1.0
info: {title: OFBiz transitional adapter, version: 0.1.0}
paths:
  /legacy-session:
    get:
      summary: Redeem a single-use identity exchange and establish a proxied OFBiz session
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: return, in: query, required: false, schema: {type: string, default: /webtools/control/main}}
      responses:
        '302': {description: Session established; redirect beneath /legacy/}
        '401': {description: Invalid or previously redeemed exchange}
        '502': {description: Sanitized legacy dependency failure}
  /internal/catalog-export:
    get:
      summary: Proxy one bounded page from the narrow OFBiz Product Catalog export service
      parameters:
        - {name: X-Workload-Token, in: header, required: true, schema: {type: string, minLength: 64}}
        - {name: recordType, in: query, required: true, schema: {type: string, enum: [categories, products, memberships]}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: cutoff, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200': {description: OFBiz service response containing the approved export page}
        '400': {description: Invalid record type, cursor, or limit}
        '401': {description: Invalid workload token}
        '502': {description: Sanitized legacy dependency failure}
