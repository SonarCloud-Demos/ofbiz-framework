name: erp-local

services:
  legacy-ofbiz-db:
    image: postgres:13
    restart: unless-stopped
    env_file:
      - ../docker/examples/postgres-demo/postgres.env
      - ../docker/examples/postgres-demo/ofbiz-postgres.env
    volumes:
      - legacy-ofbiz-db-data:/var/lib/postgresql/data
      - ../docker/examples/postgres-demo/postgres-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  legacy-ofbiz-app:
    build:
      context: ..
      target: runtime
      secrets:
        - npmrc
        - corporate_ca
    restart: unless-stopped
    depends_on:
      legacy-ofbiz-db:
        condition: service_healthy
    ports:
      - "18443:8443"
    env_file:
      - ../docker/examples/postgres-demo/ofbiz-postgres.env
    environment:
      OFBIZ_POSTGRES_HOST: legacy-ofbiz-db
      OFBIZ_DATA_LOAD: demo
      OFBIZ_HOST: localhost
      OFBIZ_CONTENT_URL_PREFIX: https://localhost:18443
    tmpfs:
      - /ofbiz/runtime/container_state:uid=1000,gid=1000,mode=0770

  modern-accounting-invoice-service:
    build:
      context: ../services/accounting-invoice-service
      secrets:
        - gradle_properties
        - corporate_ca
    restart: unless-stopped
    depends_on:
      legacy-ofbiz-db:
        condition: service_healthy
    environment:
      OFBIZ_JDBC_URL: jdbc:postgresql://legacy-ofbiz-db:5432/ofbizmaindb
      OFBIZ_DB_USER: ofbiz
      OFBIZ_DB_PASSWORD: Ab6SqDD2YM2lmEsvao-

  modern-notification-service:
    build:
      context: ../services/notification-service
      secrets:
        - gradle_properties
        - corporate_ca
    restart: unless-stopped

  modern-gateway:
    build:
      context: gateway
    restart: unless-stopped
    depends_on:
      modern-accounting-invoice-service:
        condition: service_started
      modern-notification-service:
        condition: service_started
      legacy-ofbiz-app:
        condition: service_started
    ports:
      - "18080:8443"

volumes:
  legacy-ofbiz-db-data:

secrets:
  npmrc:
    file: ${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}
  corporate_ca:
    file: ${CORPORATE_CA_FILE:-${HOME}/.certs/Sonar-CloudFlare-Inspection-Cert.pem}
  gradle_properties:
    file: ${GRADLE_USER_PROPERTIES:-${HOME}/.gradle/gradle.properties}
