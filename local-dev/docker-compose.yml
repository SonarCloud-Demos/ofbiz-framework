services:
  legacy-ofbiz-db:
    image: postgres:13
    container_name: legacy-ofbiz-db
    restart: unless-stopped
    env_file:
      - ../docker/examples/postgres-demo/postgres.env
      - ../docker/examples/postgres-demo/ofbiz-postgres.env
    volumes:
      - legacy-db-data:/var/lib/postgresql/data
      - ../docker/examples/postgres-demo/postgres-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases: [db]

  legacy-ofbiz-app:
    build:
      context: ..
      target: runtime
      secrets: [npmrc, corporate_ca]
    container_name: legacy-ofbiz-app
    restart: unless-stopped
    depends_on:
      legacy-ofbiz-db:
        condition: service_healthy
    env_file: ../docker/examples/postgres-demo/ofbiz-postgres.env
    environment:
      OFBIZ_DATA_LOAD: demo
      OFBIZ_HOST: localhost,legacy-ofbiz-app
      OFBIZ_CONTENT_URL_PREFIX: https://localhost:18443
    ports:
      - "18443:8443"
    volumes:
      - legacy-ofbiz-runtime:/ofbiz/runtime
      - ./config-hooks/force-url-config.sh:/docker-entrypoint-hooks/before-config-applied.d/00-force-url-config.sh:ro

  modern-accounting-invoice-service:
    build:
      context: ..
      dockerfile: services/accounting-invoice-service/Dockerfile
    container_name: modern-accounting-invoice-service
    restart: unless-stopped
    depends_on:
      legacy-ofbiz-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 18106
      SPRING_DATASOURCE_URL: jdbc:postgresql://legacy-ofbiz-db:5432/ofbizmaindb
      SPRING_DATASOURCE_USERNAME: ofbiz
      SPRING_DATASOURCE_PASSWORD: Ab6SqDD2YM2lmEsvao-
    ports:
      - "18106:18106"

  modern-notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: modern-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18101
    ports:
      - "18101:18101"

  modern-gateway:
    image: nginx:1.27-alpine
    container_name: modern-gateway
    restart: unless-stopped
    depends_on:
      - legacy-ofbiz-app
      - modern-accounting-invoice-service
      - modern-notification-service
    ports:
      - "18080:18080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - gateway_tls_cert
      - gateway_tls_key

volumes:
  legacy-db-data:
  legacy-ofbiz-runtime:

secrets:
  npmrc:
    file: ${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}
  corporate_ca:
    file: ${CORPORATE_CA_FILE:-${HOME}/.certs/Sonar-CloudFlare-Inspection-Cert.pem}
  gateway_tls_cert:
    file: ./certs/local.crt
  gateway_tls_key:
    file: ./certs/local.key
