events {}
http {
  upstream legacy { server legacy-ofbiz-app:8443; }
  upstream invoices { server modern-accounting-invoice-service:18106; }
  upstream notifications { server modern-notification-service:18101; }
  server {
    listen 18080 ssl;
    ssl_certificate /run/secrets/gateway_tls_cert;
    ssl_certificate_key /run/secrets/gateway_tls_key;

    location = /accounting/control/findInvoices { proxy_pass http://invoices; proxy_set_header Host $host; }
    location /api/accounting/invoices { proxy_pass http://invoices; proxy_set_header Host $host; }
    location /modern/accounting/invoices { proxy_pass http://invoices; proxy_set_header Host $host; }
    location /api/notifications/ { proxy_pass http://notifications; proxy_set_header Host $host; }

    # Everything not explicitly strangled remains in OFBiz. Rewriting preserves
    # the gateway as the browser origin while direct :18443 remains untouched.
    location / {
      proxy_pass https://legacy;
      proxy_ssl_verify off;
      proxy_set_header Host localhost:18443;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter 'https://localhost:18443' 'https://localhost:18080';
    }
  }
}
