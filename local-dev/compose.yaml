name: ofbiz-modern
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    volumes:
      - ./config/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
  database-policy:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: local-postgres-only
    command: ["sh", "-c", "psql --host=postgres --username=postgres --dbname=postgres --file=/policy/enforce-isolation.sql && touch /tmp/policy-ready && exec tail -f /dev/null"]
    volumes:
      - ./config/enforce-isolation.sql:/policy/enforce-isolation.sql:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/policy-ready"]
      interval: 2s
      timeout: 1s
      retries: 10
  messaging:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: modern
      RABBITMQ_DEFAULT_PASS: local-messaging-only
    ports: ["127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  storage:
    build:
      context: ./storage-emulator
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:10000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:10000:10000"]
  identity:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-identity-only
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./config/ofbiz-development-realm.json:/opt/keycloak/data/import/ofbiz-development-realm.json:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
  telemetry:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otel/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 10
  platform-sample:
    build:
      context: ../services/platform-sample
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 30
    depends_on:
      database-policy: {condition: service_healthy}
      messaging: {condition: service_healthy}
  shell-bff:
    build:
      context: ../services/shell-bff
    environment:
      PLATFORM_SERVICE_URL: http://platform-sample:8081/api/platform
      CATALOG_SERVICE_URL: http://product-catalog:8080/api/catalog/v1
      TRUSTED_HOSTS: localhost
      OIDC_AUTHORIZATION_ENDPOINT: http://localhost:8180/realms/ofbiz-development/protocol/openid-connect/auth
      OIDC_TOKEN_ENDPOINT: http://identity:8080/realms/ofbiz-development/protocol/openid-connect/token
      OIDC_USERINFO_ENDPOINT: http://identity:8080/realms/ofbiz-development/protocol/openid-connect/userinfo
      OIDC_CLIENT_ID: modern-shell
      OIDC_REDIRECT_URI: http://localhost:8080/auth/callback
      COOKIE_SECURE: "false"
      PLATFORM_ROUTE_PERCENT: "100"
      PLATFORM_ROUTE_DISABLED: "false"
      CATALOG_ROUTE_PERCENT: "100"
      CATALOG_ROUTE_DISABLED: "false"
      IDENTITY_EXCHANGE_URL: http://identity-access:8083/internal/exchanges
      WORKLOAD_TOKEN: local-workload-token-local-workload-token-local-workload-token-1234567890
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 30
    depends_on:
      platform-sample: {condition: service_healthy}
      identity: {condition: service_healthy}
      identity-access: {condition: service_healthy}
      product-catalog: {condition: service_healthy}
  identity-access:
    build:
      context: ../services/identity-access
    environment:
      WORKLOAD_TOKEN: local-workload-token-local-workload-token-local-workload-token-1234567890
      IDENTITY_MAPPINGS: '{"11111111-1111-1111-1111-111111111111":{"principalId":"local-developer","partyId":"admin","userLoginId":"admin"}}'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 30
  ofbiz-adapter:
    build:
      context: ../services/ofbiz-adapter
    environment:
      IDENTITY_EXCHANGE_URL: http://identity-access:8083/internal/exchanges
      OFBIZ_ORIGIN: http://shell:8080/legacy
      OFBIZ_REST_ORIGIN: http://legacy-ofbiz:8080/rest
      OFBIZ_REST_USER_LOGIN_ID: admin
      WORKLOAD_TOKEN: local-workload-token-local-workload-token-local-workload-token-1234567890
      OFBIZ_JWT_KEY: local-ofbiz-jwt-key-local-ofbiz-jwt-key-local-ofbiz-jwt-key-1234567890
    depends_on:
      identity-access: {condition: service_healthy}
      legacy-ofbiz: {condition: service_healthy}
  product-catalog:
    build:
      context: ../services/product-catalog-service
    environment:
      CATALOG_DATABASE_URL: jdbc:postgresql://postgres:5432/product_catalog
      CATALOG_DATABASE_USER: product_catalog
      CATALOG_DATABASE_PASSWORD: local-product-catalog-only
      CATALOG_INGESTION_KEY: local-catalog-ingestion-key-local-catalog-ingestion-key-1234567890
      CATALOG_BACKFILL_ENABLED: "true"
      CATALOG_BACKFILL_RECONCILE_ENABLED: "false"
      CATALOG_ADAPTER_URL: http://ofbiz-adapter:8084
      CATALOG_ADAPTER_WORKLOAD_TOKEN: local-workload-token-local-workload-token-local-workload-token-1234567890
    depends_on:
      database-policy: {condition: service_healthy}
      ofbiz-adapter: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 2s
      retries: 30
  legacy-ofbiz:
    build:
      context: ..
      target: demo
    environment:
      OFBIZ_LEGACY_EXCHANGE_ENABLED: "true"
      OFBIZ_LEGACY_EXCHANGE_KEY: local-ofbiz-jwt-key-local-ofbiz-jwt-key-local-ofbiz-jwt-key-1234567890
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/webtools/control/main"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
  shell:
    build:
      context: ../web/shell
    ports: ["8080:8080"]
    depends_on:
      shell-bff: {condition: service_healthy}
      ofbiz-adapter: {condition: service_started}
      product-catalog: {condition: service_healthy}
      legacy-ofbiz: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/modern/platform"]
      interval: 5s
      timeout: 2s
      retries: 30
