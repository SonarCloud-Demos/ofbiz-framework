server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_redirect off;

    # The edge, never the browser or an upstream, owns route classification.
    proxy_hide_header X-Application-Generation;
    proxy_hide_header X-Legacy-Identity-Assertion;
    proxy_set_header X-Application-Generation "";
    proxy_set_header X-Legacy-Identity-Assertion "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-Id $request_id;

    location = /api/v1/example {
        proxy_pass http://template-service:8080;
        add_header X-Application-Generation "modern" always;
    }

    location /catalog/products {
        rewrite ^ /modern/index.html break;
        proxy_pass http://shell-bff:8080;
        add_header X-Application-Generation "hybrid" always;
        add_header Cache-Control "no-store" always;
    }

    # Projection adapters are workload-to-workload endpoints and are never
    # reachable through the public strangler edge.
    location = /catalog/control/modernProductProjectionExport { return 404; }
    location = /catalog/control/modernProductProjectionSnapshot { return 404; }

    location /modern/ {
        proxy_pass http://shell-bff:8080;
        add_header X-Application-Generation "modern" always;
        add_header Cache-Control "no-store" always;
    }

    location /bff/ {
        proxy_pass http://shell-bff:8080;
        add_header X-Application-Generation "modern" always;
        add_header Cache-Control "no-store" always;
    }

    location /oauth2/ {
        proxy_pass http://shell-bff:8080;
        add_header X-Application-Generation "modern" always;
        add_header Cache-Control "no-store" always;
    }

    location /login/oauth2/ {
        proxy_pass http://shell-bff:8080;
        add_header X-Application-Generation "modern" always;
        add_header Cache-Control "no-store" always;
    }

    location = /__auth/legacy {
        internal;
        proxy_pass http://shell-bff:8080/bff/internal/legacy-assertion;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    error_page 401 = @oidc_login;
    location @oidc_login {
        add_header X-Application-Generation "legacy" always;
        add_header Cache-Control "no-store" always;
        return 302 /oauth2/authorization/entra;
    }

    location /template/ {
        proxy_pass http://template-route:8080/;
        add_header X-Application-Generation "modern" always;
    }

    # Default ownership is legacy so an unlisted business route cannot silently
    # become modern. The /legacy prefix remains as a compatibility alias.
    location /legacy/ {
        auth_request /__auth/legacy;
        auth_request_set $legacy_assertion $upstream_http_x_legacy_identity_assertion;
        proxy_set_header X-Legacy-Identity-Assertion $legacy_assertion;
        proxy_pass https://legacy-ofbiz:8443/;
        proxy_ssl_verify off; # Local development certificate only.
        add_header X-Application-Generation "legacy" always;
    }

    location / {
        auth_request /__auth/legacy;
        auth_request_set $legacy_assertion $upstream_http_x_legacy_identity_assertion;
        proxy_set_header X-Legacy-Identity-Assertion $legacy_assertion;
        proxy_pass https://legacy-ofbiz:8443;
        proxy_ssl_verify off; # Local development certificate only.
        add_header X-Application-Generation "legacy" always;
    }
}
