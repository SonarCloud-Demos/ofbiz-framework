server {
    listen 8080;
    server_name _;

    location /api/ {
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://template-service:8080;
    }

    location /legacy/ {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass https://legacy-ofbiz:8443/;
        proxy_ssl_verify off; # Local development certificate only.
        add_header X-Application-Generation "legacy" always;
    }

    location / {
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://template-route:8080/;
    }
}
