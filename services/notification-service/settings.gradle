pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.springframework.boot') {
                useModule("org.springframework.boot:spring-boot-gradle-plugin:${requested.version}")
            }
        }
    }
    repositories {
        maven {
            url = providers.gradleProperty('modernArtifactoryUrl')
                    .orElse('https://repox.jfrog.io/artifactory/public').get()
            credentials {
                username = providers.gradleProperty('artifactoryUsername').get()
                password = providers.gradleProperty('artifactoryPassword').get()
            }
        }
    }
}
rootProject.name = 'notification-service'
