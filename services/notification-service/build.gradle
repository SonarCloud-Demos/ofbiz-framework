plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.12'
}
group = 'com.company.erp.notifications'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories {
    maven {
        url = providers.gradleProperty('modernArtifactoryUrl')
                .orElse('https://repox.jfrog.io/artifactory/public').get()
        credentials {
            username = providers.gradleProperty('artifactoryUsername').get()
            password = providers.gradleProperty('artifactoryPassword').get()
        }
    }
}
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.12')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') { useJUnitPlatform() }
