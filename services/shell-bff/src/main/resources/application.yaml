spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: shell-bff
  security:
    oauth2:
      client:
        registration:
          entra:
            provider: entra
            client-id: ${ENTRA_CLIENT_ID}
            client-secret: ${ENTRA_CLIENT_SECRET:${entra-client-secret}}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [openid, profile, email]
        provider:
          entra:
            authorization-uri: ${ENTRA_AUTHORIZATION_URI}
            token-uri: ${ENTRA_TOKEN_URI}
            jwk-set-uri: ${ENTRA_JWK_SET_URI}
            user-name-attribute: sub
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-OFBIZ_SESSION
        http-only: true
        secure: true
        same-site: strict
        path: /
legacy-bridge:
  audience: ${LEGACY_BRIDGE_AUDIENCE:ofbiz-legacy}
  signing-key: ${LEGACY_BRIDGE_SIGNING_KEY:${legacy-bridge-signing-key}}
identity:
  allowed-tenants: ${ENTRA_ALLOWED_TENANTS}
  expected-issuer: ${ENTRA_ISSUER_URI}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  structured:
    format:
      console: ecs
