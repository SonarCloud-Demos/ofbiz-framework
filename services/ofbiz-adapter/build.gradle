plugins { id 'application'; id 'jacoco' }
group = 'org.apache.ofbiz.modern'; version = '0.1.0-SNAPSHOT'
repositories { mavenCentral() }
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.auth0:java-jwt:4.5.0'
    testImplementation platform('org.junit:junit-bom:5.11.4'); testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
application { mainClass = 'org.apache.ofbiz.modern.adapter.OfbizAdapterApplication' }
test { useJUnitPlatform() }
jacocoTestReport { reports { xml.required = true } }; check.dependsOn jacocoTestReport
tasks.register('containerJar', Jar) { archiveClassifier = 'all'; manifest { attributes 'Main-Class': application.mainClass.get() }; duplicatesStrategy = DuplicatesStrategy.EXCLUDE; from sourceSets.main.output; from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } } }
build.dependsOn containerJar
