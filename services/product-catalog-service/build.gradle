plugins {
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'org.apache.ofbiz.modern'
version = '0.1.0-SNAPSHOT'

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
test {
    useJUnitPlatform()
    systemProperty 'catalogGoldenFixture', rootProject.file('contracts/fixtures/product-catalog-demo-golden.json').absolutePath
    systemProperty 'catalogGoldenSource', rootProject.file('applications/datamodel/data/demo/OrderDemoData.xml').absolutePath
}
jacocoTestReport { reports { xml.required = true } }
check.dependsOn jacocoTestReport
