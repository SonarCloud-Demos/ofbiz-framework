spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: product-catalog-service
  datasource:
    url: ${CATALOG_DATABASE_URL:jdbc:postgresql://localhost:5432/product_catalog}
    username: ${CATALOG_DATABASE_USER:product_catalog}
    password: ${CATALOG_DATABASE_PASSWORD:${catalog-postgres-password:}}
  flyway:
    locations: classpath:db/migration
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info,prometheus
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
server:
  port: ${PORT:8080}
catalog:
  ingestion-key: ${CATALOG_INGESTION_KEY}
  legacy-sync:
    enabled: ${CATALOG_LEGACY_SYNC_ENABLED:false}
    base-url: ${CATALOG_LEGACY_BASE_URL:https://legacy-ofbiz:8443}
    export-key: ${CATALOG_LEGACY_EXPORT_KEY:}
    interval: ${CATALOG_LEGACY_SYNC_INTERVAL:PT30S}
    page-size: ${CATALOG_LEGACY_SYNC_PAGE_SIZE:200}
    snapshot-cron: ${CATALOG_LEGACY_SNAPSHOT_CRON:0 15 2 * * *}
