import groovy.json.JsonSlurper

def modernSourceRoots = [
        'services/platform-sample', 'services/shell-bff', 'services/identity-access',
        'services/ofbiz-adapter', 'services/product-catalog-service',
        'web/shell', 'web/routes/platform-test', 'web/routes/product-catalog',
        'web/packages/design-system', 'contracts/openapi', 'contracts/events', 'contracts/fixtures',
        'infra/bootstrap', 'infra/modules', 'infra/environments', 'local-dev'
] as Set

tasks.register('modernWebCheck') {
    group = 'verification'
    inputs.dir('web')
    outputs.dir('web/shell/build')
    doLast {
        def manifest = new JsonSlurper().parse(file('web/shell/src/route-manifest.json'))
        assert manifest instanceof List && !manifest.empty
        manifest.each { route ->
            ['path', 'experience', 'owner', 'roles', 'bff', 'featureFlag', 'fallback', 'e2eTest'].each {
                assert route.containsKey(it): "route ${route.path ?: '<unknown>'} is missing ${it}"
            }
            if (route.experience == 'modern') {
                assert route.marker?.label == 'Modern experience'
                assert route.marker?.dataExperience == 'modern'
            }
        }
        copy { from 'web/shell/src'; into 'web/shell/build' }
        def packageMetadata = new JsonSlurper().parse(file('web/package.json'))
        assert packageMetadata.engines.node == '24.11.1'
        assert packageMetadata.packageManager == 'npm@11.6.2'
        assert packageMetadata.scripts.check.contains('playwright test')
        assert file('web/shell/test/product-catalog.spec.mjs').text.contains("new AxeBuilder({page})")
        assert file('.github/workflows/build.yml').text.contains('Product catalog browser acceptance')
        def shellProxy = file('web/shell/nginx.conf').text
        ['Content-Security-Policy', 'Permissions-Policy', 'Referrer-Policy',
         'X-Content-Type-Options', 'X-Frame-Options'].each {
            assert shellProxy.contains("add_header ${it}"): "Shell browser security header ${it} is missing"
        }
    }
}

tasks.register('modernContractCheck') {
    group = 'verification'
    inputs.dir('contracts')
    doLast {
        def api = file('contracts/openapi/platform-sample.yaml').text
        assert api.contains('openapi: 3.1.0') && api.contains('/health/ready:')
        def adapterApi = file('contracts/openapi/ofbiz-adapter.yaml').text
        assert adapterApi.contains('/legacy-session:') && !adapterApi.contains('entityName')
        def catalogApi = file('contracts/openapi/product-catalog.yaml').text
        assert catalogApi.contains('/api/catalog/v1/categories/{categoryId}:')
        assert catalogApi.contains('/api/catalog/v1/search:')
        def catalogIngestionApi = file('contracts/openapi/product-catalog-ingestion.yaml').text
        assert catalogIngestionApi.contains('/internal/catalog/projection/batches:')
        def catalogGolden = new JsonSlurper().parse(file('contracts/fixtures/product-catalog-demo-golden.json'))
        assert catalogGolden.fixtureVersion == 1
        assert catalogGolden.evidence.productionEvidence == false
        assert !catalogGolden.browseCases.empty && !catalogGolden.searchCases.empty
        def event = new JsonSlurper().parse(file('contracts/events/platform-sample.schema.json'))
        assert event.'$schema' && event.type == 'object'
        assert event.required.containsAll(['id', 'occurredAt', 'type'])
    }
}

tasks.register('modernCatalogGoldenCheck') {
    group = 'verification'
    inputs.files('contracts/fixtures/product-catalog-demo-golden.json',
            'applications/datamodel/data/demo/OrderDemoData.xml')
    doLast {
        def golden = new JsonSlurper().parse(file('contracts/fixtures/product-catalog-demo-golden.json'))
        def demo = new groovy.xml.XmlSlurper(false, false)
                .parse(file('applications/datamodel/data/demo/OrderDemoData.xml'))
        def categories = demo.ProductCategory.collectEntries { node ->
            String id = node.@productCategoryId.text()
            [(id): [categoryId: id, parentCategoryId: node.@primaryParentCategoryId.text() ?: null,
                    name: node.@categoryName.text() ?: node.@description.text() ?: id,
                    description: node.@longDescription.text() ?: node.@description.text() ?: null]]
        }
        def products = demo.Product.collectEntries { node ->
            String id = node.@productId.text()
            [(id): [productId: id, name: node.@productName.text() ?: node.@internalName.text() ?: id,
                    description: node.@description.text() ?: null,
                    productType: node.@productTypeId.text() ?: 'UNKNOWN',
                    virtual: node.@isVirtual.text() == 'Y', variant: node.@isVariant.text() == 'Y']]
        }
        def memberships = demo.ProductCategoryMember.collect { node ->
            String sequence = node.@sequenceNum.text()
            [categoryId: node.@productCategoryId.text(), productId: node.@productId.text(),
             sequence: sequence ? new BigDecimal(sequence) : null]
        }

        golden.categories.each { expected ->
            def actual = categories[expected.categoryId]
            assert actual != null: "Demo category ${expected.categoryId} is missing"
            assert actual.subMap(['categoryId', 'name', 'description']) == expected.subMap(['categoryId', 'name', 'description'])
            def children = categories.values().findAll { it.parentCategoryId == expected.categoryId }
                    .sort { left, right -> left.categoryId <=> right.categoryId }
                    .collect { it.categoryId }
            assert children == expected.childCategoryIds: "Category ${expected.categoryId} children drifted"
        }
        golden.products.each { expected ->
            assert products[expected.productId] == expected: "Product ${expected.productId} fields drifted"
        }
        golden.browseCases.each { expected ->
            def ids = memberships.findAll { it.categoryId == expected.categoryId }
                    .sort { left, right ->
                        int sequence = (left.sequence == null ? new BigDecimal('1E100') : left.sequence) <=>
                                (right.sequence == null ? new BigDecimal('1E100') : right.sequence)
                        sequence != 0 ? sequence : left.productId <=> right.productId
                    }.collect { it.productId }
            assert ids == expected.expectedProductIds: "Browse ordering for ${expected.categoryId} drifted"
        }
        golden.searchCases.each { expected ->
            String query = expected.query.toLowerCase(Locale.ROOT)
            def ids = products.values().findAll {
                it.name.toLowerCase(Locale.ROOT).contains(query) ||
                        (it.description ?: '').toLowerCase(Locale.ROOT).contains(query)
            }.sort { left, right ->
                int name = left.name.toLowerCase(Locale.ROOT) <=> right.name.toLowerCase(Locale.ROOT)
                name != 0 ? name : left.productId <=> right.productId
            }.collect { it.productId }
            assert ids == expected.expectedProductIds: "Search results for '${expected.query}' drifted"
        }
    }
}

tasks.register('modernInfraCheck') {
    group = 'verification'
    inputs.dir('infra')
    doLast {
        fileTree('infra').matching { include '**/*.tf' }.files.each {
            assert !it.text.contains('\t'): "${it} contains tabs"
        }
        assert file('infra/.terraform-version').text.trim() == '1.13.3'
        ['bootstrap', 'environments/dev', 'environments/staging', 'environments/ephemeral'].each { root ->
            assert file("infra/${root}").exists(): "Terraform root ${root} is missing"
        }
        def infrastructure = fileTree('infra').matching { include '**/*.tf' }.files*.text.join('\n')
        ['azurerm_private_endpoint', 'azurerm_cdn_frontdoor_firewall_policy',
         'azurerm_cdn_frontdoor_route', 'azurerm_cdn_frontdoor_security_policy',
         'azurerm_monitor_metric_alert', 'azurerm_consumption_budget_resource_group',
         'azurerm_container_app" "shell', 'use_oidc'].each {
            assert infrastructure.contains(it): "Phase 2 infrastructure control ${it} is missing"
        }
        assert !infrastructure.contains('client_secret'): 'Terraform must use workload identity, not client secrets'
        assert file('infra/environments/tests/platform.tftest.hcl').text.contains('mock_provider "azurerm"')
        assert file('infra/policy/ci-input.json').text.contains('"long_lived_client_secret": false')
        assert file('.github/workflows/ephemeral-environment.yml').text.contains('ttl-cleanup:')
        assert file('docs/migration/phase2/azure-acceptance.md').text.contains('no Azure infrastructure is available')
        assert infrastructure.contains('azurerm_cdn_frontdoor_route" "legacy_default')
        assert file('docs/migration/phase3/threat-model.md').text.contains('Token replay')
        assert file('docs/migration/phase3/azure-acceptance.md').text.contains('WAIVED by project decision')
    }
}

tasks.register('modernLocalDevCheck') {
    group = 'verification'
    inputs.files('local-dev/compose.yaml', 'local-dev/fixtures/platform.json')
    doLast {
        def compose = file('local-dev/compose.yaml').text
        ['shell', 'shell-bff', 'identity-access', 'ofbiz-adapter', 'product-catalog', 'platform-sample', 'legacy-ofbiz', 'postgres', 'database-policy', 'messaging',
         'storage', 'identity', 'telemetry'].each {
            assert compose.contains("  ${it}:"): "Compose service ${it} is missing"
        }
        assert new JsonSlurper().parse(file('local-dev/fixtures/platform.json')).fixtureVersion == 1
    }
}

tasks.register('verifyModernBuildRegistration') {
    group = 'verification'
    inputs.files(fileTree('.') {
        include 'services/*/src/**', 'web/*/src/**', 'web/routes/*/**', 'web/packages/*/**'
        include 'contracts/openapi/**', 'contracts/events/**', 'infra/**/*.tf', 'local-dev/**'
        exclude '**/build/**', '**/node_modules/**', 'local-dev/logs/**'
    })
    doLast {
        def candidates = [] as Set
        file('services').listFiles()?.findAll {
            it.directory && new File(it, 'src').exists() && new File(it, 'build.gradle').exists()
        }?.each {
            candidates << "services/${it.name}"
        }
        ['web/shell', 'web/routes/platform-test', 'web/routes/product-catalog', 'web/packages/design-system',
         'contracts/openapi', 'contracts/events', 'contracts/fixtures', 'infra/bootstrap', 'infra/modules',
         'infra/environments', 'local-dev'].each { if (file(it).exists()) candidates << it }
        def missing = candidates.findAll { !modernSourceRoots.contains(it.toString()) }
        assert missing.empty: "Modern source roots are not registered: ${missing.sort()}"
    }
}

tasks.named('check') {
    dependsOn ':services:platform-sample:check', ':services:shell-bff:check', ':services:identity-access:check',
            ':services:ofbiz-adapter:check', ':services:product-catalog-service:check', modernWebCheck, modernContractCheck,
            modernCatalogGoldenCheck,
            modernInfraCheck, modernLocalDevCheck, verifyModernBuildRegistration
}
tasks.named('build') {
    dependsOn ':services:platform-sample:build', ':services:shell-bff:build', ':services:identity-access:build',
            ':services:ofbiz-adapter:build', ':services:product-catalog-service:build', modernWebCheck, modernContractCheck,
            modernCatalogGoldenCheck,
            modernInfraCheck, modernLocalDevCheck, verifyModernBuildRegistration
}
