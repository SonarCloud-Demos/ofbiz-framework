import groovy.json.JsonSlurper

def modernSourceRoots = [
        'services/platform-sample', 'services/shell-bff', 'services/identity-access',
        'services/ofbiz-adapter', 'web/shell', 'web/routes/platform-test',
        'web/packages/design-system', 'contracts/openapi', 'contracts/events',
        'infra/bootstrap', 'infra/modules', 'infra/environments', 'local-dev'
] as Set

tasks.register('modernWebCheck') {
    group = 'verification'
    inputs.dir('web')
    outputs.dir('web/shell/build')
    doLast {
        def manifest = new JsonSlurper().parse(file('web/shell/src/route-manifest.json'))
        assert manifest instanceof List && !manifest.empty
        manifest.each { route ->
            ['path', 'experience', 'owner', 'roles', 'bff', 'featureFlag', 'fallback', 'e2eTest'].each {
                assert route.containsKey(it): "route ${route.path ?: '<unknown>'} is missing ${it}"
            }
            if (route.experience == 'modern') {
                assert route.marker?.label == 'Modern experience'
                assert route.marker?.dataExperience == 'modern'
            }
        }
        copy { from 'web/shell/src'; into 'web/shell/build' }
        def packageMetadata = new JsonSlurper().parse(file('web/package.json'))
        assert packageMetadata.engines.node == '24.11.1'
        assert packageMetadata.packageManager == 'npm@11.6.2'
    }
}

tasks.register('modernContractCheck') {
    group = 'verification'
    inputs.dir('contracts')
    doLast {
        def api = file('contracts/openapi/platform-sample.yaml').text
        assert api.contains('openapi: 3.1.0') && api.contains('/health/ready:')
        def adapterApi = file('contracts/openapi/ofbiz-adapter.yaml').text
        assert adapterApi.contains('/legacy-session:') && !adapterApi.contains('entityName')
        def event = new JsonSlurper().parse(file('contracts/events/platform-sample.schema.json'))
        assert event.'$schema' && event.type == 'object'
        assert event.required.containsAll(['id', 'occurredAt', 'type'])
    }
}

tasks.register('modernInfraCheck') {
    group = 'verification'
    inputs.dir('infra')
    doLast {
        fileTree('infra').matching { include '**/*.tf' }.files.each {
            assert !it.text.contains('\t'): "${it} contains tabs"
        }
        assert file('infra/.terraform-version').text.trim() == '1.13.3'
        ['bootstrap', 'environments/dev', 'environments/staging', 'environments/ephemeral'].each { root ->
            assert file("infra/${root}").exists(): "Terraform root ${root} is missing"
        }
        def infrastructure = fileTree('infra').matching { include '**/*.tf' }.files*.text.join('\n')
        ['azurerm_private_endpoint', 'azurerm_cdn_frontdoor_firewall_policy',
         'azurerm_cdn_frontdoor_route', 'azurerm_cdn_frontdoor_security_policy',
         'azurerm_monitor_metric_alert', 'azurerm_consumption_budget_resource_group',
         'azurerm_container_app" "shell', 'use_oidc'].each {
            assert infrastructure.contains(it): "Phase 2 infrastructure control ${it} is missing"
        }
        assert !infrastructure.contains('client_secret'): 'Terraform must use workload identity, not client secrets'
        assert file('infra/environments/tests/platform.tftest.hcl').text.contains('mock_provider "azurerm"')
        assert file('infra/policy/ci-input.json').text.contains('"long_lived_client_secret": false')
        assert file('.github/workflows/ephemeral-environment.yml').text.contains('ttl-cleanup:')
        assert file('docs/migration/phase2/azure-acceptance.md').text.contains('no Azure infrastructure is available')
        assert infrastructure.contains('azurerm_cdn_frontdoor_route" "legacy_default')
        assert file('docs/migration/phase3/threat-model.md').text.contains('Token replay')
        assert file('docs/migration/phase3/azure-acceptance.md').text.contains('WAIVED by project decision')
    }
}

tasks.register('modernLocalDevCheck') {
    group = 'verification'
    inputs.files('local-dev/compose.yaml', 'local-dev/fixtures/platform.json')
    doLast {
        def compose = file('local-dev/compose.yaml').text
        ['shell', 'shell-bff', 'identity-access', 'ofbiz-adapter', 'platform-sample', 'legacy-ofbiz', 'postgres', 'database-policy', 'messaging',
         'storage', 'identity', 'telemetry'].each {
            assert compose.contains("  ${it}:"): "Compose service ${it} is missing"
        }
        assert new JsonSlurper().parse(file('local-dev/fixtures/platform.json')).fixtureVersion == 1
    }
}

tasks.register('verifyModernBuildRegistration') {
    group = 'verification'
    inputs.files(fileTree('.') {
        include 'services/*/src/**', 'web/*/src/**', 'web/routes/*/**', 'web/packages/*/**'
        include 'contracts/openapi/**', 'contracts/events/**', 'infra/**/*.tf', 'local-dev/**'
        exclude '**/build/**', '**/node_modules/**', 'local-dev/logs/**'
    })
    doLast {
        def candidates = [] as Set
        file('services').listFiles()?.findAll {
            it.directory && new File(it, 'src').exists() && new File(it, 'build.gradle').exists()
        }?.each {
            candidates << "services/${it.name}"
        }
        ['web/shell', 'web/routes/platform-test', 'web/packages/design-system',
         'contracts/openapi', 'contracts/events', 'infra/bootstrap', 'infra/modules',
         'infra/environments', 'local-dev'].each { if (file(it).exists()) candidates << it }
        def missing = candidates.findAll { !modernSourceRoots.contains(it.toString()) }
        assert missing.empty: "Modern source roots are not registered: ${missing.sort()}"
    }
}

tasks.named('check') {
    dependsOn ':services:platform-sample:check', ':services:shell-bff:check', ':services:identity-access:check',
            ':services:ofbiz-adapter:check', modernWebCheck, modernContractCheck,
            modernInfraCheck, modernLocalDevCheck, verifyModernBuildRegistration
}
tasks.named('build') {
    dependsOn ':services:platform-sample:build', ':services:shell-bff:build', ':services:identity-access:build',
            ':services:ofbiz-adapter:build', modernWebCheck, modernContractCheck,
            modernInfraCheck, modernLocalDevCheck, verifyModernBuildRegistration
}
