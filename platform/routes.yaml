version: 1
defaultOwner: legacy-ofbiz
routes:
  - id: modern-shell
    pathPrefix: /modern/
    owner: modern-shell
    generation: modern
    authentication: entra-bff-session
  - id: template-api
    path: /api/v1/example
    owner: template-service
    generation: modern
    authentication: development-only
  - id: template-route
    pathPrefix: /template/
    owner: template-route
    generation: modern
    authentication: development-only
  - id: shell-bff
    pathPrefix: /bff/
    owner: shell-bff
    generation: modern
    authentication: entra-bff-session
  - id: oauth-start
    pathPrefix: /oauth2/
    owner: shell-bff
    generation: modern
    authentication: public-protocol-endpoint
  - id: oauth-callback
    pathPrefix: /login/oauth2/
    owner: shell-bff
    generation: modern
    authentication: public-protocol-endpoint
  - id: legacy
    pathPrefix: /
    owner: legacy-ofbiz
    generation: legacy
    authentication: legacy-bridge
