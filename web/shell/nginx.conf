server {
  listen 8080;
  root /usr/share/nginx/html;
  location /bff/ { proxy_pass http://shell-bff:8082; proxy_set_header Host $host; proxy_set_header X-Correlation-ID $request_id; }
  location /auth/ { proxy_pass http://shell-bff:8082; proxy_set_header Host $host; proxy_set_header X-Correlation-ID $request_id; }
  location = /legacy-session { proxy_pass http://ofbiz-adapter:8084; proxy_set_header Host $host; }
  location /legacy/ { proxy_pass https://legacy-ofbiz:8443/; proxy_ssl_verify off; }
  location / { try_files $uri /index.html; }
}
