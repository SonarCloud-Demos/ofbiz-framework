server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  location /bff/ { proxy_pass http://shell-bff:8082; proxy_set_header Host $host; proxy_set_header X-Correlation-ID $request_id; }
  location /auth/ { proxy_pass http://shell-bff:8082; proxy_set_header Host $host; proxy_set_header X-Correlation-ID $request_id; }
  location = /legacy-session { proxy_pass http://ofbiz-adapter:8084; proxy_set_header Host $host; }
  location /legacy/ { proxy_pass https://legacy-ofbiz:8443/; proxy_ssl_verify off; }
  location / { try_files $uri /index.html; }
}
